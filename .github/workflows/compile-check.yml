name: Compile Check
run-name: "Compile Check on ${{ github.ref_name }} (${{ github.sha }})"

# Lightweight compilation check triggered on every push to work branches.
# Verifies the plugin builds cleanly against a single fixed Unreal Engine version.
# Use this for fast in-progress feedback; the full matrix build runs on PRs to dev/main.
# See .github/instructions/verification.md for details.

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'refactor/**'
      - 'chore/**'
      - 'test/**'
      - 'scout/**'
      - 'ci/**'
      - 'meta/**'
      - 'copilot/**'
  workflow_dispatch:
    inputs:
      ueImage:
        description: "Unreal Engine image tag (leave empty to use AGENT_CHECK_UE_IMAGE variable)"
        type: string
        default: ""

jobs:
  compile-check:
    name: Verify SDK compiles
    runs-on: ubuntu-22.04-4-core
    timeout-minutes: 30
    env:
      UE_IMAGE: ${{ github.event.inputs.ueImage || vars.AGENT_CHECK_UE_IMAGE || 'dev-5.5' }}

    steps:
      - name: Setup git
        run: |
          git config --global --add safe.directory /__w/unreal-sdk/unreal-sdk

      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Pull Unreal Engine image ${{ env.UE_IMAGE }}
        run: |
          docker login ghcr.io \
            -u ${{ secrets.UNREAL_DOCKER_PACKAGES_READ_USERNAME }} \
            -p ${{ secrets.UNREAL_DOCKER_PACKAGES_READ_ACCESS_TOKEN }}
          docker pull ghcr.io/epicgames/unreal-engine:${{ env.UE_IMAGE }}

      - name: Set plugin information variables
        run: |
          SDK_PATH="$(pwd)"
          echo "SDK_PATH=${SDK_PATH}" >> $GITHUB_ENV
          SDK_NAME=$(find "$SDK_PATH" -maxdepth 2 -type f -name "*.uplugin" \
            | sed -n -r "s/.*\/([-A-Za-z0-9_]+)\.uplugin/\1/p" | head -1)
          echo "SDK_NAME=${SDK_NAME}" >> $GITHUB_ENV

      - name: Prepare build directories
        run: |
          mkdir -p tmp/build
          mkdir -p tmp/logs

      - name: Build Plugin (Linux, single UE version)
        id: build
        continue-on-error: true
        run: |
          chmod 777 tmp
          chmod 777 tmp/build
          docker run --rm \
            -v "$(pwd):/mnt/source" \
            ghcr.io/epicgames/unreal-engine:${{ env.UE_IMAGE }} \
            sh -c "/home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh \
              BuildPlugin \
              -TargetPlatforms=\"Linux\" \
              -Plugin=\"/mnt/source/${SDK_NAME}/${SDK_NAME}.uplugin\" \
              -Package=\"/mnt/source/tmp/build\" \
              -Rocket" \
            2>&1 | tee tmp/logs/UAT.log

      - name: Expose build log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-check-${{ env.UE_IMAGE }}-UAT.log
          path: ${{ env.SDK_PATH }}/tmp/logs/UAT.log
          if-no-files-found: warn

      - name: Check build result and report errors
        if: always()
        run: |
          LOG="${{ env.SDK_PATH }}/tmp/logs/UAT.log"

          if [ ! -f "$LOG" ]; then
            echo "## ⚠️ No build log found" >> "$GITHUB_STEP_SUMMARY"
            echo "The Docker step may have failed before producing output." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Check for RunUAT success marker
          if grep -q "AutomationTool exiting with ExitCode=0" "$LOG"; then
            echo "## ✅ Compilation Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Plugin built successfully against \`${{ env.UE_IMAGE }}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Build failed — extract compiler errors for the Job Summary.
          # Handles both compiler toolchain output formats:
          #   MSVC  : path/to/File.cpp(line): error C####: message
          #   Clang : path/to/file.cpp:line:col: error: message
          ERRORS=$(grep -E "\.(cpp|h)(\([0-9]+\).*error (C|LNK)[0-9]+|:[0-9]+:[0-9]+: error:)" "$LOG" || true)

          # Also catch generic UBT/RunUAT failure lines
          UAT_ERRORS=$(grep -iE "^(ERROR|FATAL|Exception):" "$LOG" | head -20 || true)

          parse_error_line() {
            local line="$1"
            local file line_num msg code
            if [[ "$line" =~ ^(.*)\(([0-9]+)\):\ error\ ([A-Z]+[0-9]+):\ (.+)$ ]]; then
              # MSVC format
              file=$(echo "${BASH_REMATCH[1]}" | sed 's|/mnt/source/||g')
              line_num="${BASH_REMATCH[2]}"
              code="${BASH_REMATCH[3]}"
              msg="${BASH_REMATCH[4]}"
              echo "table|${file}|${line_num}|**${code}**: ${msg}"
            elif [[ "$line" =~ ^(.*):([0-9]+):[0-9]+:\ error:\ (.+)$ ]]; then
              # Clang/GCC format
              file=$(echo "${BASH_REMATCH[1]}" | sed 's|/mnt/source/||g')
              line_num="${BASH_REMATCH[2]}"
              msg="${BASH_REMATCH[3]}"
              echo "table|${file}|${line_num}|${msg}"
            fi
          }

          {
            echo "## ❌ Compilation Failed"
            echo ""
            echo "**UE image:** \`${{ env.UE_IMAGE }}\`"
            echo ""

            if [ -n "$ERRORS" ]; then
              echo "### Compiler Errors"
              echo ""
              echo "| File | Line | Error |"
              echo "| ---- | ---- | ----- |"
              while IFS= read -r line; do
                parsed=$(parse_error_line "$line")
                if [ -n "$parsed" ]; then
                  IFS='|' read -r _ file line_num msg <<< "$parsed"
                  echo "| \`${file}\` | ${line_num} | ${msg} |"
                fi
              done <<< "$ERRORS"
              echo ""
            fi

            if [ -n "$UAT_ERRORS" ]; then
              echo "### Build Tool Errors"
              echo ""
              echo '```'
              echo "$UAT_ERRORS"
              echo '```'
            fi

            echo ""
            echo "See the \`compile-check-${{ env.UE_IMAGE }}-UAT.log\` artifact for the full log."
          } >> "$GITHUB_STEP_SUMMARY"

          # Inline annotations for compiler errors (appear in PR diff view)
          if [ -n "$ERRORS" ]; then
            while IFS= read -r line; do
              parsed=$(parse_error_line "$line")
              if [ -n "$parsed" ]; then
                IFS='|' read -r _ file line_num msg <<< "$parsed"
                echo "::error file=${file},line=${line_num}::${msg}"
              fi
            done <<< "$ERRORS"
          fi

          # Emit short summary lines from the log as error annotations as well
          grep -iE "^(ERROR|FATAL):" "$LOG" | head -5 | while IFS= read -r line; do
            echo "::error::$line"
          done

          exit 1
